name: wecraft-design-training

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wecraft_dt
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wecraft_dt"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/wecraft_dt?schema=public
      SESSION_SECRET: ${SESSION_SECRET:-local-demo-only-change-before-production}
      APP_URL: ${APP_URL:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      STORAGE_DRIVER: local
      STORAGE_ROOT: /app/storage
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - app_storage:/app/storage
    restart: unless-stopped

volumes:
  dbdata:
  app_storage:

